<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Simone Falcomer — Photographer & Art Director</title>
<meta name="description" content="Simone Falcomer, photographer and art director based in Barcelona. Fashion, beauty, documentary and personal projects.">
<link rel="icon" type="image/png" href="https://simonefalcomer.art/favicon.png">
<link rel="shortcut icon" href="https://simonefalcomer.art/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#111;color:#ece8df;overflow:hidden;overscroll-behavior:none;}
body{font-family:'IBM Plex Mono',monospace;}

#stage{position:fixed;inset:0;}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.04);will-change:opacity,transform;}
.slide.on{opacity:1;animation:drift 14s ease-out forwards;}
@keyframes drift{from{transform:scale(1.04);}to{transform:scale(1.12);}}
#veil{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,9,8,.55) 0%,rgba(10,9,8,.12) 40%,rgba(10,9,8,.12) 60%,rgba(10,9,8,.7) 100%);}

#top{position:fixed;left:3vw;right:3vw;top:4vh;z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:20px;}
#name{font-family:'Syncopate',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(12px,1.3vw,18px);letter-spacing:.32em;line-height:1;}
#sub{font-size:clamp(9px,.9vw,12px);letter-spacing:.28em;text-transform:uppercase;color:#d9d3c4;text-align:right;}

#menu{position:fixed;left:3vw;right:3vw;bottom:5vh;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;}
#menu a{font-family:'Syncopate',sans-serif;font-weight:700;font-size:clamp(11px,1.45vw,22px);letter-spacing:.14em;text-transform:uppercase;color:#ece8df;text-decoration:none;position:relative;padding-bottom:6px;opacity:.78;transition:opacity .3s;}
#menu a::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:#ece8df;transition:width .35s ease;}
#menu a:hover,#menu a.act{opacity:1;}
#menu a:hover::after,#menu a.act::after{width:100%;}

#count{position:fixed;right:3vw;top:50%;transform:translateY(-50%);z-index:5;font-size:11px;letter-spacing:.2em;writing-mode:vertical-rl;opacity:.6;}

@media(max-width:768px){
  #top{top:5vh;flex-direction:column;align-items:flex-start;gap:10px;}
  #name{font-size:14px;letter-spacing:.28em;}
  #sub{text-align:left;letter-spacing:.2em;}
  #menu{flex-direction:column;align-items:flex-start;gap:14px;bottom:6vh;}
  #menu a{font-size:15px;opacity:.9;}
  #count{display:none;}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="veil"></div>

<div id="top">
  <h1 id="name">Simone Falcomer</h1>
  <div id="sub">Photographer &amp; Art Director &mdash; Barcelona</div>
</div>

<div id="count"></div>

<nav id="menu">
  <a href="fashion.html" data-k="fashion">Fashion</a>
  <a href="beauty.html" data-k="beauty">Beauty</a>
  <a href="personal.html" data-k="personal">Personal</a>
  <a href="backstage.html" data-k="backstage">Backstage</a>
  <a href="ecommerce.html" data-k="ecommerce">E-commerce</a>
  <a href="featured.html" data-k="featured">Featured in</a>
  <a href="info.html" data-k="info">Info</a>
</nav>

<script>
(function(){
  var ROOT='https://falcomersimone-cell.github.io/sito/';
  function F(n,ext){return ROOT+'fashion/'+encodeURIComponent('Simone Falcomer Fashion Photography '+n+'.'+(ext||'jpeg'));}
  function B(n){var nm=(n===11)?'Simone Falcomer Photography Beauty'+n+'.jpeg':'Simone Falcomer Photography Beauty '+n+'.jpeg';return ROOT+'beauty/'+encodeURIComponent(nm);}

  /* SELEZIONE: k = sezione collegata (hover sul menu), src = foto */
  var PHOTOS=[
    {k:'fashion',  src:F(1)},
    {k:'beauty',   src:B(12)},
    {k:'fashion',  src:F(4)},
    {k:'beauty',   src:B(3)},
    {k:'fashion',  src:F(8)},
    {k:'beauty',   src:B(7)},
    {k:'fashion',  src:F(13)}
  ];

  var stage=document.getElementById('stage');
  var count=document.getElementById('count');
  var links=[].slice.call(document.querySelectorAll('#menu a'));
  var slides=[],cur=-1,timer=null,hover=false;

  function pad(n){return (n<10?'0':'')+n;}

  function show(i){
    if(!slides.length)return;
    i=(i+slides.length)%slides.length;
    if(i===cur)return;
    if(cur>=0)slides[cur].el.classList.remove('on');
    var el=slides[i].el;
    el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
    cur=i;
    count.textContent=pad(i+1)+' / '+pad(slides.length);
    links.forEach(function(a){a.classList.toggle('act',a.getAttribute('data-k')===slides[i].k);});
  }
  function start(){clearInterval(timer);timer=setInterval(function(){if(!hover)show(cur+1);},5200);}

  /* carica solo le foto che esistono */
  var pending=PHOTOS.length;
  PHOTOS.forEach(function(p){
    var im=new Image();
    im.onload=function(){
      var d=document.createElement('div');d.className='slide';
      d.style.backgroundImage='url("'+p.src+'")';
      stage.appendChild(d);
      slides.push({el:d,k:p.k,src:p.src});
      if(slides.length===1){show(0);start();}
      else count.textContent=pad(cur+1)+' / '+pad(slides.length);
    };
    im.onerror=function(){};
    im.src=p.src;
  });

  /* hover sul menu: mostra una foto di quella sezione */
  links.forEach(function(a){
    a.addEventListener('mouseenter',function(){
      var k=a.getAttribute('data-k');
      for(var i=0;i<slides.length;i++){
        if(slides[i].k===k){hover=true;show(i);return;}
      }
      hover=true;
    });
    a.addEventListener('mouseleave',function(){hover=false;});
  });

  /* swipe / frecce per cambiare foto */
  var sx=null;
  window.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  window.addEventListener('touchend',function(e){
    if(sx===null)return;
    var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>50){show(cur+(dx<0?1:-1));start();}
  },{passive:true});
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){show(cur+1);start();}
    if(e.key==='ArrowLeft'){show(cur-1);start();}
  });
})();
</script>
</body>
</html>
