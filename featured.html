<style>
:root{--bg:#f1f2ee;--fg:#111;--pad:clamp(14px,2.2vw,40px);--bot:9vh;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--fg);}
body{font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;overflow:hidden;}
a{color:inherit;text-decoration:none;}

header{position:fixed;left:0;right:0;top:0;height:11vh;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);}
.brand{display:flex;align-items:baseline;gap:clamp(10px,1.2vw,22px);}
.name{font-weight:700;font-size:clamp(20px,1.9vw,35px);letter-spacing:-.055em;line-height:1;text-transform:lowercase;}
.role{font-size:clamp(8px,.66vw,12px);letter-spacing:.02em;text-transform:uppercase;}
nav{display:flex;gap:clamp(16px,2.6vw,48px);font-size:clamp(9px,.7vw,13px);text-transform:uppercase;letter-spacing:.02em;}
nav a{padding-bottom:2px;border-bottom:1px solid transparent;transition:border-color .25s;}
nav a:hover,nav a.on{border-bottom-color:var(--fg);}

/* loghi: una fila al centro, piccoli e nitidi (vettoriali) */
main{position:fixed;left:var(--pad);right:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(28px,4.2vw,84px) clamp(28px,4.2vw,84px);}
.logo{display:block;opacity:.9;transition:opacity .35s ease;}
.logo svg{display:block;width:calc(var(--w) * 1vw);min-width:calc(var(--w) * 7px);height:auto;fill:var(--fg);color:var(--fg);}
a.logo{cursor:default;}a.logo.can{cursor:pointer;}
main:hover .logo{opacity:.25;}
main:hover .logo:hover{opacity:1;}

footer{position:fixed;left:0;right:0;bottom:0;height:var(--bot);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);pointer-events:none;}
footer>*{pointer-events:auto;}
