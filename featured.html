<style>
:root{--bg:#f1f2ee;--fg:#111;--pad:clamp(14px,2.2vw,40px);--bot:9vh;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--fg);}
body{font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;overflow:hidden;}
a{color:inherit;text-decoration:none;}

header{position:fixed;left:0;right:0;top:0;height:11vh;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);}
.brand{display:flex;align-items:baseline;gap:clamp(10px,1.2vw,22px);}
.name{font-weight:700;font-size:clamp(20px,1.9vw,35px);letter-spacing:-.055em;line-height:1;text-transform:lowercase;}
.role{font-size:clamp(8px,.66vw,12px);letter-spacing:.02em;text-transform:uppercase;}
nav{display:flex;gap:clamp(16px,2.6vw,48px);font-size:clamp(9px,.7vw,13px);text-transform:uppercase;letter-spacing:.02em;}
nav a{padding-bottom:2px;border-bottom:1px solid transparent;transition:border-color .25s;}
nav a:hover,nav a.on{border-bottom-color:var(--fg);}

/* loghi: una fila al centro, piccoli e nitidi (vettoriali) */
main{position:fixed;left:var(--pad);right:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(28px,4.2vw,84px) clamp(28px,4.2vw,84px);}
.logo{display:block;opacity:.9;transition:opacity .35s ease;}
.logo svg{display:block;width:calc(var(--w) * 1vw);min-width:calc(var(--w) * 7px);height:auto;fill:var(--fg);color:var(--fg);}
a.logo{cursor:default;}a.logo.can{cursor:pointer;}
main:hover .logo{opacity:.25;}
main:hover .logo:hover{opacity:1;}

footer{position:fixed;left:0;right:0;bottom:0;height:var(--bot);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);pointer-events:none;}
footer>*{pointer-events:auto;}
.fl{display:flex;gap:clamp(14px,1.6vw,28px);font-size:clamp(8px,.62vw,11px);text-transform:uppercase;letter-spacing:.02em;align-items:baseline;}
.fl span{font-weight:700;}
.fl a{opacity:.55;transition:opacity .25s;}
.fl a:hover{opacity:1;}

@media(max-width:768px){
  header{height:110px;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;}
  .brand{flex-direction:column;align-items:flex-start;gap:6px;}
  .name{font-size:30px;white-space:nowrap;}
  .role{font-size:9px;}
  nav{gap:14px;font-size:10px;flex-wrap:wrap;}
  main{gap:34px 30px;}
  .logo svg{width:calc(var(--w) * 3.2vw);}
  .fl{gap:14px;font-size:9px;}
}

/* elenco pubblicazioni (Neo2, Cake) */
#panel{position:fixed;left:var(--pad);right:var(--pad);bottom:calc(var(--bot) + 4vh);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .3s,transform .3s;}
#panel.on{opacity:1;pointer-events:auto;transform:none;}
#panel .t{font-size:clamp(8px,.62vw,11px);text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin-bottom:4px;}
#panel a{font-size:clamp(15px,1.3vw,22px);letter-spacing:-.02em;border-bottom:1px solid var(--fg);padding-bottom:1px;}
#panel a.off{opacity:.35;border-bottom-color:transparent;pointer-events:none;}
/* foto (Vogue) */
#lb{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:6vh 6vw;cursor:zoom-out;}
#lb.on{display:flex;}
#lb img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
#lb .x{position:fixed;top:var(--pad);right:var(--pad);font-size:clamp(9px,.7vw,13px);text-transform:uppercase;letter-spacing:.02em;}
</style>

<div id="panel"></div>
<div id="lb"><span class="x">Close ✕</span><img alt="Vogue Nederland"></div>

<script>
/* ============ LINK DELLE PUBBLICAZIONI ============
   url:'...'  -> il logo apre quel link in una nuova scheda
   items:[...] -> il logo mostra un elenco di pubblicazioni (ognuna con il suo link)
   image:'...' -> il logo apre una foto (Vogue): metti il file nella repo, es. 'vogue.jpg'
   Lascia '' dove non hai ancora il link: resta non cliccabile. */
var PUBS={
  vogue:   {image:''},
  collater:{url:''},
  neo2:    {items:[{label:'Neo2 — pubblicazione 1',url:''},{label:'Neo2 — pubblicazione 2',url:''},{label:'Neo2 — pubblicazione 3',url:''}]},
  kaltblut:{url:''},
  vein:    {url:''},
  cake:    {items:[{label:'Cake Magazine — pubblicazione 1',url:''},{label:'Cake Magazine — pubblicazione 2',url:''}]}
};

(function(){
  var panel=document.getElementById('panel'),lb=document.getElementById('lb'),lbi=lb.querySelector('img');
  var openKey=null;
  function closePanel(){panel.classList.remove('on');openKey=null;}
  document.querySelectorAll('a.logo').forEach(function(a){
    var k=a.getAttribute('data-key'),p=PUBS[k]||{};
    if(p.url){a.href=p.url;a.target='_blank';a.rel='noopener';a.classList.add('can');return;}
    if(p.image||p.items)a.classList.add('can');
    a.addEventListener('click',function(e){
      e.preventDefault();
      if(p.image){lbi.src=p.image;lb.classList.add('on');return;}
      if(p.items){
        if(openKey===k){closePanel();return;}
        openKey=k;panel.innerHTML='<span class="t">'+a.getAttribute('aria-label')+'</span>';
        p.items.forEach(function(it){
          var l=document.createElement('a');l.textContent=it.label;
          if(it.url){l.href=it.url;l.target='_blank';l.rel='noopener';}else l.className='off';
          panel.appendChild(l);
        });
        panel.classList.add('on');
      }
    });
  });
  lb.addEventListener('click',function(){lb.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){lb.classList.remove('on');closePanel();}});
  document.addEventListener('click',function(e){if(!e.target.closest('a.logo')&&!e.target.closest('#panel'))closePanel();});
})();
</script>
